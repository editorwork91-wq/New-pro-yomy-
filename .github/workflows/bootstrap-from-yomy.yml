name: Bootstrap New Yomy from production source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yomy-bootstrap
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard
        id: guard
        shell: bash
        run: |
          if [ -f .yomy-bootstrap-complete ]; then
            echo "restore=false" >> "$GITHUB_OUTPUT"
            echo "Baseline already present; nothing to do."
          else
            echo "restore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import production Yomy source
        if: steps.guard.outputs.restore == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/yomy-source
          git clone --depth 1 https://github.com/editorwork91-wq/yomy.git /tmp/yomy-source
          rsync -a --exclude '.git/' --exclude '.github/workflows/' /tmp/yomy-source/ ./

      - name: Preserve bootstrap marker and add recovery metadata
        if: steps.guard.outputs.restore == 'true'
        run: |
          set -euo pipefail
          cat > .yomy-bootstrap-complete <<'EOF'
          Source: editorwork91-wq/yomy
          Source branch: main
          Imported by: GitHub Actions
          Purpose: reproducible production baseline for New-pro-yomy-
          Safety: source repository main is never modified by this workflow
          EOF

      - name: Commit imported project
        if: steps.guard.outputs.restore == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: bootstrap New-pro-yomy from production Yomy"
          git push origin HEAD:main
