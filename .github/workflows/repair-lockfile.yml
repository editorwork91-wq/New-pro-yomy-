name: Repair Yomy dependency lockfile

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yomy-lockfile-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard
        id: guard
        shell: bash
        run: |
          if [ -f .yomy-lockfile-repaired ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repair package lock
        if: steps.guard.outputs.needed == 'true'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Commit repaired lockfile
        if: steps.guard.outputs.needed == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' "package-lock.json regenerated from package.json on target main." > .yomy-lockfile-repaired
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .yomy-lockfile-repaired
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): repair package lock consistency"
          git push origin HEAD:main
